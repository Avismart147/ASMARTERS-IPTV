      // =========================================================

      const state = {

        watchedVod: saved?.watchedVod || {},
        lockedCategories: saved?.lockedCategories || [],
        unlockedSessionCats: {},
        settings: Object.assign({
          streamFormat: 'm3u8',
          timeFormat: '12h',
          epgOffsetHours: 0,
          autoNextEpisode: true,
          parentalPin: '0000',
          corsProxy: '',
          aspectRatio: 'contain'
        }, saved?.settings || {}),
        // UI Selections
        liveState: {

          muted: false,

        },

        },

          selectedDayOffset: 0
        },
        multiState: {
          layout: '2x2', // 2x2 | 1x2
          activeAudioSlot: 0,
          slots: ['ch_101', 'ch_201', 'ch_301', 'ch_401']
        },

          open: false,

          subtitle: '',
          url: '',

          itemType: null,
          seriesId: null,
          seasonNum: null,
          episodeNum: null
        },
        statusMessage: null
      };

      // If user already had an active profile saved, boot straight to dashboard with demo/loaded catalog
      if (state.activeProfileId && state.profiles.some(p => p.id === state.activeProfileId)) {
        const activeP = state.profiles.find(p => p.id === state.activeProfileId);
        if (activeP?.m3uCatalog) {
          state.catalog = activeP.m3uCatalog;
        }
        state.view = 'dashboard';
      }

      // Active HLS instances map for cleanup
      let mainHls = null;
      let modalHls = null;
      let multiHlsList = [];
      let clockTimer = null;
      let sleepTimerId = null;

      // =========================================================
      // UTILITIES
      // =========================================================
      function escapeHtml(str) {
        return String(str ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function showToast(msg, type = 'info') {
        const container = document.getElementById('toast-container');
        if (!container) return;
        const colors = {
          info: 'bg-surface-800 border-brand-500/40 text-slate-100',
          success: 'bg-emerald-950/90 border-emerald-500/50 text-emerald-100',
          error: 'bg-rose-950/90 border-rose-500/50 text-rose-100',
          warn: 'bg-amber-950/90 border-amber-500/50 text-amber-100'
        };
        const el = document.createElement('div');
        el.className = `pointer-events-auto px-4 py-3 rounded-xl border shadow-xl text-sm font-medium flex items-center gap-2 transition-all duration-300 ${colors[type] || colors.info}`;
        el.textContent = msg;
        container.appendChild(el);
        setTimeout(() => {
          el.classList.add('opacity-0', 'translate-y-2');
          setTimeout(() => el.remove(), 300);
        }, 3200);
      }

      function formatTime(ts) {
        const d = new Date(ts + (state.settings.epgOffsetHours || 0) * 3600000);
        return d.toLocaleTimeString([], {
          hour: '2-digit',
          minute: '2-digit',
          hour12: state.settings.timeFormat === '12h'
        });
      }

      function getCurrentProgram(ch) {
        if (!ch || !ch.epg || !ch.epg.length) return { title: 'Live Broadcast', progress: 45, start: Date.now() - 1800000, end: Date.now() + 1800000, desc: 'Streaming live.' };
        const now = Date.now();
        const prog = ch.epg.find(p => now >= p.start && now <= p.end) || ch.epg[1] || ch.epg[0];
        const total = Math.max(1, prog.end - prog.start);
        const pct = Math.max(5, Math.min(100, Math.round(((now - prog.start) / total) * 100)));
        return { ...prog, progress: pct };
      }

      function getNextProgram(ch) {
        if (!ch || !ch.epg || ch.epg.length < 2) return null;
        const now = Date.now();
        return ch.epg.find(p => p.start > now) || ch.epg[ch.epg.length - 1];
      }

      function isFav(type, id) {
        return (state.favorites[type] || []).includes(id);
      }

      function toggleFav(type, id) {
        const arr = state.favorites[type] || [];
        const idx = arr.indexOf(id);
        if (idx >= 0) {
          arr.splice(idx, 1);
          showToast('Removed from Favorites', 'info');
        } else {
          arr.push(id);
          showToast('Added to Favorites', 'success');
        }
        state.favorites[type] = arr;
        persistState();
      }

      function addHistory(item) {
        state.history = state.history.filter(h => !(h.id === item.id && h.type === item.type));
        state.history.unshift({ ...item, watchedAt: Date.now() });
        if (state.history.length > 30) state.history.length = 30;
        persistState();
      }

      function activeProfile() {
        return state.profiles.find(p => p.id === state.activeProfileId) || null;

      // =========================================================
      // M3U / M3U8 PARSER
      // =========================================================
      function parseM3U(text) {
        const lines = text.split(/\r?\n/);
        const channels = [];
        const movies = [];
        const liveCatMap = new Map();
        const vodCatMap = new Map();
        let currentInfo = null;
        let idx = 1;

        for (let i = 0; i < lines.length; i++) {
          const line = lines[i].trim();
          if (!line) continue;
          if (line.startsWith('#EXTINF:')) {
            const groupMatch = line.match(/group-title="([^"]*)"/i);
            const logoMatch = line.match(/tvg-logo="([^"]*)"/i);
            const namePart = line.split(',').slice(1).join(',').trim() || `Stream ${idx}`;
            const groupName = (groupMatch ? groupMatch[1].trim() : '') || 'General';
            currentInfo = {
              name: namePart,
              group: groupName,
              logo: logoMatch ? logoMatch[1] : ''
            };
          } else if (!line.startsWith('#') && /^https?:\/\//i.test(line)) {
            const info = currentInfo || { name: `Channel ${idx}`, group: 'General', logo: '' };
            const lowerUrl = line.toLowerCase();
            const isVod = /\.(mp4|mkv|avi|mov)(\?|$)/i.test(lowerUrl) || /movie|vod/i.test(info.group);
            if (isVod) {
              const catId = 'vod_' + info.group.toLowerCase().replace(/[^a-z0-9]+/g, '_');
              if (!vodCatMap.has(catId)) vodCatMap.set(catId, { id: catId, name: info.group });
              movies.push({
                id: 'm3u_vod_' + idx,
                title: info.name,
                year: 2025,
                rating: '8.0',
                duration: 'VOD',
                categoryId: catId,
                genre: info.group,
                director: 'Imported Playlist',
                cast: 'N/A',
                plot: `Imported from M3U playlist (${info.group}).`,
                url: line,
                gradient: 'from-sky-700 via-indigo-900 to-slate-950'
              });
            } else {
              const catId = 'live_' + info.group.toLowerCase().replace(/[^a-z0-9]+/g, '_');
              if (!liveCatMap.has(catId)) liveCatMap.set(catId, { id: catId, name: info.group });
              channels.push({
                id: 'm3u_ch_' + idx,
                num: idx,
                name: info.name,
                categoryId: catId,
                url: line,
                catchup: false,
                color: '#0ea5e9',
                badge: 'M3U',
                epg: []
              });
            }
            idx++;
            currentInfo = null;
          }
        }

        return {
          liveCategories: Array.from(liveCatMap.values()),
          liveChannels: channels,
          vodCategories: Array.from(vodCatMap.values()),
          movies,
          seriesCategories: [],
          series: []
        };
      }

      // =========================================================
      // XTREAM CODES API CLIENT (WITH CORS PROXY SUPPORT)
      // =========================================================
      const BACKGROUND_PROXIES = [
        'https://corsproxy.io/?url=',
        'https://api.allorigins.win/raw?url=',
        'https://api.codetabs.com/v1/proxy?quest='
      ];

      function normalizeServerUrl(raw) {
        let u = (raw || '').trim().replace(/\/+$/, '');
        if (u && !/^https?:\/\//i.test(u)) u = 'http://' + u;
        return u;
      }

      function buildProxiedUrl(proxyUrl, target) {
        if (!proxyUrl) return target;
        if (proxyUrl.includes('?') || proxyUrl.endsWith('=')) return `${proxyUrl}${encodeURIComponent(target)}`;
        return `${proxyUrl.replace(/\/+$/, '')}/?url=${encodeURIComponent(target)}`;
      }

      async function fetchXtreamJson(serverUrl, username, password, action, proxyUrl) {
        const cleanBase = normalizeServerUrl(serverUrl);
        const target = `${cleanBase}/player_api.php?username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}${action ? '&action=' + encodeURIComponent(action) : ''}`;
        if (window.AndroidBridge && typeof window.AndroidBridge.httpGet === 'function') {
          const nativeText = window.AndroidBridge.httpGet(target);
          if (!nativeText) throw new Error('Native HTTP request failed');
          return JSON.parse(nativeText);
        }
        const finalUrl = buildProxiedUrl(proxyUrl, target);
        const res = await fetch(finalUrl);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const text = await res.text();
        return JSON.parse(text);
      }

      async function fetchXtreamWithBackgroundProxy(serverUrl, username, password, preferredProxy) {
        const normalized = normalizeServerUrl(serverUrl);
        const candidates = [];
        if (preferredProxy) candidates.push(preferredProxy);
        if (/^https:\/\//i.test(normalized)) candidates.push('');
        BACKGROUND_PROXIES.forEach(p => { if (!candidates.includes(p)) candidates.push(p); });
        if (!candidates.includes('')) candidates.push('');

        let lastErr = null;
        for (const p of candidates) {
          try {
            const auth = await fetchXtreamJson(normalized, username, password, '', p);
            if (auth && typeof auth === 'object') return { auth, workingProxy: p };
          } catch (e) {
            lastErr = e;
          }
        }
        throw lastErr || new Error('Unable to reach server');
      }

      async function connectXtreamAccount(payload) {
        const { name, username, password } = payload;
        const serverUrl = normalizeServerUrl(payload.serverUrl);
        const preferredProxy = (payload.proxyUrl || state.settings.corsProxy || '').trim();
        if (!serverUrl || !username || !password) {
          showToast('Please fill in Server URL, Username, and Password.', 'error');
          return;
        }

        showToast('Connecting to Xtream server...', 'info');
        try {
          const { auth, workingProxy } = await fetchXtreamWithBackgroundProxy(serverUrl, username, password, preferredProxy);
          const proxyUrl = workingProxy;
          if (!auth || !auth.user_info || auth.user_info.auth === 0) {
            showToast('Authentication failed. Check username or password.', 'error');
            return;
          }

          const [liveCats, liveStreams, vodCats, vodStreams, serCats, serList] = await Promise.all([
            fetchXtreamJson(serverUrl, username, password, 'get_live_categories', proxyUrl).catch(() => []),
            fetchXtreamJson(serverUrl, username, password, 'get_live_streams', proxyUrl).catch(() => []),
            fetchXtreamJson(serverUrl, username, password, 'get_vod_categories', proxyUrl).catch(() => []),
            fetchXtreamJson(serverUrl, username, password, 'get_vod_streams', proxyUrl).catch(() => []),
            fetchXtreamJson(serverUrl, username, password, 'get_series_categories', proxyUrl).catch(() => []),
            fetchXtreamJson(serverUrl, username, password, 'get_series', proxyUrl).catch(() => [])
          ]);

          const cleanBase = serverUrl.replace(/\/+$/, '');
          const ext = state.settings.streamFormat || 'm3u8';
          const catalog = {
            liveCategories: (liveCats || []).map(c => ({ id: String(c.category_id), name: c.category_name })),
            liveChannels: (liveStreams || []).map((s, idx) => ({

            vodCategories: (vodCats || []).map(c => ({ id: String(c.category_id), name: c.category_name })),

              categoryId: String(m.category_id),
              genre: 'Movie',
              director: 'Xtream VOD',
              cast: '',
              plot: m.name,
              url: `${cleanBase}/movie/${encodeURIComponent(username)}/${encodeURIComponent(password)}/${m.stream_id}.${m.container_extension || 'mp4'}`,
              gradient: 'from-orange-600 via-red-800 to-slate-950'
            })),
            seriesCategories: (serCats || []).map(c => ({ id: String(c.category_id), name: c.category_name })),
            series: (serList || []).map(sr => ({
              id: 'xt_ser_' + sr.series_id,
              xtreamSeriesId: sr.series_id,
              title: sr.name,
              year: sr.releaseDate ? sr.releaseDate.slice(0, 4) : 2025,
              rating: sr.rating || '8.0',

              plot: sr.plot || sr.name,
              gradient: 'from-violet-700 via-purple-900 to-slate-950',
              seasons: { 1: [] }
            }))
          };

          const profile = {
            id: 'prof_' + Date.now(),
            name: name || username,
            type: 'xtream',
            serverUrl: cleanBase,
            username,
            password,
            proxyUrl: proxyUrl || '',
            expDate: auth.user_info.exp_date ? new Date(Number(auth.user_info.exp_date) * 1000).toLocaleDateString() : 'Unlimited',

      function destroyHls(instance) {
        if (instance) {
          try { instance.destroy(); } catch (e) {}
        }
        return null;
      }

      function attachHlsToVideo(videoEl, url, onError) {
        if (!videoEl || !url) return null;
        if (window.Hls && Hls.isSupported() && /\.m3u8(\?|$)/i.test(url)) {
          const hls = new Hls({ enableWorker: true, lowLatencyMode: true });
          hls.loadSource(url);
          hls.attachMedia(videoEl);
          hls.on(Hls.Events.MANIFEST_PARSED, () => {
            videoEl.play().catch(() => {});
          });
          hls.on(Hls.Events.ERROR, (event, data) => {
            if (data.fatal && onError) onError(data.details || 'Stream playback error');
          });
          return hls;
        } else {
          videoEl.src = url;
          videoEl.play().catch(() => {});
          return null;
        }
      }

      function startMainLivePlayer() {
        const video = document.getElementById('live-video-el');
        const errBox = document.getElementById('live-player-error');
        if (!video) return;
        const ch = state.catalog.liveChannels.find(c => c.id === state.liveState.activeChannelId) || state.catalog.liveChannels[0];
        if (!ch) return;
        mainHls = destroyHls(mainHls);
        if (errBox) errBox.classList.add('hidden');
        video.muted = state.liveState.muted;
        mainHls = attachHlsToVideo(video, ch.url, (msg) => {
          if (errBox) {
            errBox.classList.remove('hidden');
            const txt = errBox.querySelector('[data-err-msg]');
            if (txt) txt.textContent = `Stream unavailable (${msg}). Try another channel or verify stream URL.`;
          }
        });
        addHistory({ id: ch.id, type: 'live', title: ch.name, subtitle: getCurrentProgram(ch).title });
      }

      function startMultiPlayers() {
        multiHlsList.forEach(h => destroyHls(h));
        multiHlsList = [];
        const count = state.multiState.layout === '2x2' ? 4 : 2;
        for (let i = 0; i < count; i++) {
          const video = document.getElementById(`multi-video-${i}`);
          const chId = state.multiState.slots[i];
          const ch = state.catalog.liveChannels.find(c => c.id === chId) || state.catalog.liveChannels[i % state.catalog.liveChannels.length];
          if (video && ch) {
            video.muted = i !== state.multiState.activeAudioSlot;
            const hls = attachHlsToVideo(video, ch.url, () => {});
            if (hls) multiHlsList.push(hls);
          }
        }
      }

      function parseDurationMinutes(dur) {
        if (!dur) return 0;
        const hMatch = String(dur).match(/(\d+)\s*h/i);
        const mMatch = String(dur).match(/(\d+)\s*m/i);
        const h = hMatch ? Number(hMatch[1]) * 60 : 0;
        const m = mMatch ? Number(mMatch[1]) : (!hMatch ? (parseInt(dur, 10) || 0) : 0);
        return h + m;
      }

          openSeriesDetailModal(sr.id, currentSeason);
          render();

        if (epSortSel) {
          epSortSel.onchange = (e) => {
            state.seriesState.episodeSort = e.target.value;
            openSeriesDetailModal(sr.id, currentSeason);
          };
        }
        document.querySelectorAll('.sd-season-btn').forEach(btn => {
          btn.onclick = () => openSeriesDetailModal(sr.id, Number(btn.dataset.season));
        });
        document.querySelectorAll('.sd-play-ep').forEach(btn => {
          btn.onclick = () => {
            const ep = episodes.find(e => e.id === btn.dataset.epId);
            if (ep) {
              openVodPlayerModal({
                title: `${sr.title} — S${currentSeason}:E${ep.num} ${ep.title}`,
                subtitle: ep.desc,
                url: ep.url,
                itemId: ep.id,
                itemType: 'series',
                seriesId: sr.id,
                seasonNum: currentSeason,
                episodeNum: ep.num
              });
            }
          };
        });
      }

          ${renderTopNav()}
          <main class="flex-1 max-w-4xl w-full mx-auto p-4 sm:p-6 space-y-5">
            <h1 class="text-xl font-extrabold text-white">Settings & Preferences</h1>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
              <!-- Stream & Player Settings -->
              <div class="glass-card rounded-2xl p-5 space-y-4">
                <h2 class="text-sm font-bold text-white border-b border-slate-800 pb-2">Stream & Player</h2>
                <div>
                  <label class="block text-xs font-semibold text-slate-300 mb-1.5">Stream Format</label>
                  <select id="set-format" class="w-full px-3 py-2 rounded-xl bg-surface-950 border border-slate-700 text-xs text-white">
                    <option value="m3u8" ${state.settings.streamFormat === 'm3u8' ? 'selected' : ''}>HLS (.m3u8) — Recommended</option>
                    <option value="ts" ${state.settings.streamFormat === 'ts' ? 'selected' : ''}>MPEG-TS (.ts)</option>
                  </select>
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-300 mb-1.5">Time Format</label>
                  <select id="set-time" class="w-full px-3 py-2 rounded-xl bg-surface-950 border border-slate-700 text-xs text-white">
                    <option value="12h" ${state.settings.timeFormat === '12h' ? 'selected' : ''}>12-Hour (AM/PM)</option>
                    <option value="24h" ${state.settings.timeFormat === '24h' ? 'selected' : ''}>24-Hour</option>
                  </select>
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-300 mb-1.5">EPG Time Offset (Hours)</label>
                  <input id="set-offset" type="number" min="-12" max="12" value="${state.settings.epgOffsetHours}" class="w-full px-3 py-2 rounded-xl bg-surface-950 border border-slate-700 text-xs text-white" />
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-300 mb-1.5">CORS Proxy Worker URL</label>
                  <input id="set-proxy" type="url" value="${escapeHtml(state.settings.corsProxy || '')}" placeholder="https://your-worker.workers.dev/?url=" class="w-full px-3 py-2 rounded-xl bg-surface-950 border border-slate-700 text-xs text-white" />
                </div>
                <button type="button" id="btn-save-settings" class="w-full py-2.5 rounded-xl bg-brand-500 hover:bg-brand-600 text-xs font-bold text-white">Save Stream Settings</button>
              </div>

              <!-- Parental Control & Maintenance -->
              <div class="glass-card rounded-2xl p-5 space-y-4">
                <h2 class="text-sm font-bold text-white border-b border-slate-800 pb-2">Parental Control</h2>
                <div>
                  <label class="block text-xs font-semibold text-slate-300 mb-1.5">4-Digit PIN (Current: ${escapeHtml(state.settings.parentalPin)})</label>
                  <div class="flex gap-2">
                    <input id="set-pin" type="password" maxlength="4" placeholder="New 4-digit PIN" class="flex-1 px-3 py-2 rounded-xl bg-surface-950 border border-slate-700 text-xs text-white" />
                    <button type="button" id="btn-save-pin" class="px-4 py-2 rounded-xl bg-surface-800 hover:bg-surface-700 text-xs font-semibold text-white">Update PIN</button>
                  </div>
                </div>
                <div>
                  <p class="text-xs font-semibold text-slate-300 mb-2">Lock Live Categories</p>
                  <div class="space-y-1.5 max-h-36 overflow-y-auto pr-1">
                    ${state.catalog.liveCategories.map(c => {
                      const isLocked = state.lockedCategories.includes(c.id);
                      return `
                        <label class="flex items-center justify-between p-2 rounded-lg bg-surface-900/80 text-xs cursor-pointer">
                          <span class="text-slate-200">${escapeHtml(c.name)}</span>
                          <input type="checkbox" data-lock-cat="${escapeHtml(c.id)}" ${isLocked ? 'checked' : ''} class="accent-brand-500" />
                        </label>
                      `;
                    }).join('')}
                  </div>
                </div>
                <div class="pt-2 border-t border-slate-800 flex gap-2">
                  <button type="button" id="btn-clear-history" class="flex-1 py-2 rounded-xl bg-surface-800 hover:bg-rose-600/80 text-xs font-semibold text-slate-200 transition">Clear History</button>
                  <button type="button" id="btn-speed-test" class="flex-1 py-2 rounded-xl bg-emerald-600/80 hover:bg-emerald-500 text-xs font-semibold text-white transition">Run Speed Check</button>
                </div>
              </div>
            </div>
          </main>
        `;
      }

      // =========================================================
      // RENDER & EVENT BINDING
      // =========================================================
      function render() {
        cleanupAllPlayers();
        const app = document.getElementById('app');
        if (!app) return;

        if (state.view === 'login') app.innerHTML = renderLoginView();
        else if (state.view === 'dashboard') app.innerHTML = renderDashboardView();
        else if (state.view === 'live') app.innerHTML = renderLiveView();
        else if (state.view === 'movies') app.innerHTML = renderMoviesView();
        else if (state.view === 'series') app.innerHTML = renderSeriesView();
        else if (state.view === 'epg') app.innerHTML = renderEpgView();
        else if (state.view === 'multiscreen') app.innerHTML = renderMultiScreenView();
        else if (state.view === 'catchup') app.innerHTML = renderCatchupView();
        else if (state.view === 'settings') app.innerHTML = renderSettingsView();

        bindEvents();

        if (state.view === 'live') startMainLivePlayer();
        if (state.view === 'multiscreen') startMultiPlayers();
      }

      function bindEvents() {
        // Navigation buttons
        document.querySelectorAll('[data-nav]').forEach(btn => {
          btn.onclick = () => {
            state.view = btn.dataset.nav;
            render();
          };
        });

        const switchBtn = document.getElementById('btn-switch-user');
        if (switchBtn) {
          switchBtn.onclick = () => {
            state.view = 'login';
            render();
          };
        }

        // Login View Events
        document.querySelectorAll('[data-login-tab]').forEach(btn => {
          btn.onclick = () => {
            state.loginTab = btn.dataset.loginTab;
            render();
          };
        });

        const demoQuick = document.getElementById('btn-demo-quick');
        if (demoQuick) demoQuick.onclick = activateDemoProfile;

        document.querySelectorAll('[data-select-profile]').forEach(btn => {
          btn.onclick = () => {
            const p = state.profiles.find(x => x.id === btn.dataset.selectProfile);
            if (!p) return;
            state.activeProfileId = p.id;
            if (p.type === 'demo') state.catalog = buildDemoCatalog();
            else if (p.m3uCatalog) state.catalog = p.m3uCatalog;
            state.view = 'dashboard';
            persistState();
            render();
          };
        });

        document.querySelectorAll('[data-del-profile]').forEach(btn => {
          btn.onclick = () => {
            state.profiles = state.profiles.filter(x => x.id !== btn.dataset.delProfile);
            if (state.activeProfileId === btn.dataset.delProfile) state.activeProfileId = null;
            persistState();
            showToast('Profile deleted', 'info');
            render();
          };
        });

        const xtForm = document.getElementById('xtream-login-form');
        if (xtForm) {
          xtForm.onsubmit = (e) => {
            e.preventDefault();
            connectXtreamAccount({
              name: document.getElementById('xt-name').value.trim(),
              serverUrl: document.getElementById('xt-server').value.trim(),
              username: document.getElementById('xt-user').value.trim(),
              password: document.getElementById('xt-pass').value.trim(),
              proxyUrl: state.settings.corsProxy || ''
            });
          };
        }

        const m3uForm = document.getElementById('m3u-login-form');
        if (m3uForm) {
          m3uForm.onsubmit = async (e) => {
            e.preventDefault();
            const name = document.getElementById('m3u-name').value.trim() || 'M3U Playlist';
            const urlVal = document.getElementById('m3u-url').value.trim();
            const fileInput = document.getElementById('m3u-file');
            try {
              let rawText = '';
              if (fileInput?.files?.length) {
                rawText = await fileInput.files[0].text();
              } else if (urlVal) {
                const res = await fetch(urlVal);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                rawText = await res.text();
              } else {
                showToast('Provide an M3U URL or upload a local .m3u file.', 'error');
                return;
              }
              const parsed = parseM3U(rawText);
              if (!parsed.liveChannels.length && !parsed.movies.length) {
                showToast('No playable streams found in M3U.', 'error');
                return;
              }
              const prof = {
                id: 'prof_' + Date.now(),
                name,
                type: 'm3u',
                username: 'M3U User',
                expDate: 'Unlimited',
                status: 'Active',
                maxConn: '1',
                activeConn: '1',
                m3uCatalog: parsed
              };
              state.profiles.push(prof);
              state.activeProfileId = prof.id;
              state.catalog = parsed;
              if (parsed.liveChannels.length) state.liveState.activeChannelId = parsed.liveChannels[0].id;
              state.view = 'dashboard';
              persistState();
              showToast(`Loaded ${parsed.liveChannels.length} channels & ${parsed.movies.length} VODs`, 'success');
              render();
            } catch (err) {
              showToast(`Failed to load M3U (${err.message})`, 'error');
            }
          };
        }

        // Dashboard Recent Resume
        document.querySelectorAll('[data-resume-id]').forEach(btn => {
          btn.onclick = () => {
            const type = btn.dataset.resumeType;
            const id = btn.dataset.resumeId;
            if (type === 'live') {
              state.liveState.activeChannelId = id;
              state.view = 'live';
              render();
            } else if (type === 'movies') {
              openMovieDetailModal(id);
            } else if (type === 'series') {
              state.view = 'series';
              render();
            }
          };
        });

        // Live TV Events
        document.querySelectorAll('[data-live-cat]').forEach(btn => {
          btn.onclick = () => {
            const catId = btn.dataset.liveCat;
            requireCategoryPin(catId, () => {
              state.liveState.selectedCatId = catId;
              render();
            });
          };
        });

        const liveSearch = document.getElementById('live-search-input');
        if (liveSearch) {
          liveSearch.oninput = (e) => {
            state.liveState.search = e.target.value;
            render();
            const el = document.getElementById('live-search-input');
            if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
          };
        }

        document.querySelectorAll('[data-select-ch]').forEach(el => {
          el.onclick = (e) => {
            if (e.target.closest('[data-fav-ch]')) return;
            state.liveState.activeChannelId = el.dataset.selectCh;
            render();
          };
        });

        document.querySelectorAll('[data-fav-ch]').forEach(btn => {
          btn.onclick = (e) => {
            e.stopPropagation();
            toggleFav('live', btn.dataset.favCh);
            render();
          };
        });

        const btnPrev = document.getElementById('btn-ch-prev');
        const btnNext = document.getElementById('btn-ch-next');
        if (btnPrev && btnNext) {
          const chs = state.catalog.liveChannels;
          const idx = chs.findIndex(c => c.id === state.liveState.activeChannelId);
          btnPrev.onclick = () => {
            if (!chs.length) return;
            state.liveState.activeChannelId = chs[(idx - 1 + chs.length) % chs.length].id;
            render();
          };
          btnNext.onclick = () => {
            if (!chs.length) return;
            state.liveState.activeChannelId = chs[(idx + 1) % chs.length].id;
            render();
          };
        }

        const btnAspect = document.getElementById('btn-aspect');
        if (btnAspect) {
          btnAspect.onclick = () => {
            const modes = ['contain', 'cover', 'fill'];
            const next = modes[(modes.indexOf(state.settings.aspectRatio) + 1) % modes.length];
            state.settings.aspectRatio = next;
            persistState();
            render();
          };
        }

        const btnActiveFav = document.getElementById('btn-active-fav');
        if (btnActiveFav) {
          btnActiveFav.onclick = () => {
            toggleFav('live', state.liveState.activeChannelId);
            render();
          };
        }

        const btnRetryLive = document.getElementById('btn-retry-live');
        if (btnRetryLive) btnRetryLive.onclick = startMainLivePlayer;

        const btnOpenMx = document.getElementById('btn-open-mx');
        if (btnOpenMx) {
          btnOpenMx.onclick = () => {
            const ch = state.catalog.liveChannels.find(c => c.id === state.liveState.activeChannelId);
            if (ch && window.AndroidBridge && typeof window.AndroidBridge.playStream === 'function') {
              window.AndroidBridge.playStream(ch.url, ch.name, getCurrentProgram(ch).title);
            }
          };
        }

        // Movies Events
        document.querySelectorAll('[data-vod-cat]').forEach(btn => {
          btn.onclick = () => {
            state.moviesState.selectedCatId = btn.dataset.vodCat;
            render();
            const el = document.getElementById('vod-results-anchor');
            if (el && window.innerWidth < 1024) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
          };
        });
        const vodSearch = document.getElementById('vod-search-input');
        if (vodSearch) {
          vodSearch.oninput = (e) => {
            state.moviesState.search = e.target.value;
            render();
            const el = document.getElementById('vod-search-input');
            if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
          };
        }
        const vodSort = document.getElementById('vod-sort-select');
        if (vodSort) {
          vodSort.onchange = (e) => {
            state.moviesState.sort = e.target.value;
            render();
          };
        }
        document.querySelectorAll('[data-open-movie]').forEach(card => {
          card.onclick = () => openMovieDetailModal(card.dataset.openMovie);
        });

        // Series Events
        document.querySelectorAll('[data-ser-cat]').forEach(btn => {
          btn.onclick = () => {
            state.seriesState.selectedCatId = btn.dataset.serCat;
            render();
            const el = document.getElementById('ser-results-anchor');
            if (el && window.innerWidth < 1024) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
          };
        });
        const serSearch = document.getElementById('ser-search-input');
        if (serSearch) {
          serSearch.oninput = (e) => {
            state.seriesState.search = e.target.value;
            render();
            const el = document.getElementById('ser-search-input');
            if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
          };
        }
        document.querySelectorAll('[data-open-series]').forEach(card => {
          card.onclick = () => openSeriesDetailModal(card.dataset.openSeries);
        });

        // EPG Events
        document.querySelectorAll('[data-tune-epg]').forEach(btn => {
          btn.onclick = () => {
            state.liveState.activeChannelId = btn.dataset.tuneEpg;
            state.view = 'live';
            render();
          };
        });

        // Multi-Screen Events
        document.querySelectorAll('[data-multi-layout]').forEach(btn => {
          btn.onclick = () => {
            state.multiState.layout = btn.dataset.multiLayout;
            render();
          };
        });
        document.querySelectorAll('[data-multi-slot]').forEach(sel => {
          sel.onchange = (e) => {
            state.multiState.slots[Number(sel.dataset.multiSlot)] = e.target.value;
            render();
          };
        });
        document.querySelectorAll('[data-multi-audio]').forEach(btn => {
          btn.onclick = () => {
            state.multiState.activeAudioSlot = Number(btn.dataset.multiAudio);
            for (let i = 0; i < 4; i++) {
              const v = document.getElementById(`multi-video-${i}`);
              if (v) v.muted = i !== state.multiState.activeAudioSlot;
            }
            render();
          };
        });

        // Catch-Up Events
        document.querySelectorAll('[data-cu-ch]').forEach(btn => {
          btn.onclick = () => {
            state.catchupState.selectedChannelId = btn.dataset.cuCh;
            render();
          };
        });
        document.querySelectorAll('[data-cu-play]').forEach(btn => {
          btn.onclick = () => {
            const archiveChannels = state.catalog.liveChannels.filter(c => c.catchup);
            const ch = archiveChannels.find(c => c.id === state.catchupState.selectedChannelId) || archiveChannels[0];
            const prog = ch?.epg?.[Number(btn.dataset.cuPlay)];
            if (ch && prog) {
              openVodPlayerModal({
                title: `${ch.name} — ${prog.title}`,
                subtitle: `Catch-Up Replay (${formatTime(prog.start)} - ${formatTime(prog.end)})`,
                url: ch.url,
                itemId: ch.id + '_cu_' + btn.dataset.cuPlay,
                itemType: 'live'
              });
            }
          };
        });

        // Settings Events
        const saveSetBtn = document.getElementById('btn-save-settings');
        if (saveSetBtn) {
          saveSetBtn.onclick = () => {
            state.settings.streamFormat = document.getElementById('set-format').value;
            state.settings.timeFormat = document.getElementById('set-time').value;
            state.settings.epgOffsetHours = Number(document.getElementById('set-offset').value) || 0;
            state.settings.corsProxy = document.getElementById('set-proxy').value.trim();
            persistState();
            showToast('Settings saved', 'success');
            render();
          };
        }

        const savePinBtn = document.getElementById('btn-save-pin');
        if (savePinBtn) {
          savePinBtn.onclick = () => {
            const p = document.getElementById('set-pin').value.trim();
            if (!/^\d{4}$/.test(p)) {
              showToast('PIN must be exactly 4 digits', 'error');
              return;
            }
            state.settings.parentalPin = p;
            persistState();
            showToast('Parental PIN updated', 'success');
            render();
          };
        }

        document.querySelectorAll('[data-lock-cat]').forEach(chk => {
          chk.onchange = (e) => {
            const id = chk.dataset.lockCat;
            if (e.target.checked) {
              if (!state.lockedCategories.includes(id)) state.lockedCategories.push(id);
            } else {
              state.lockedCategories = state.lockedCategories.filter(x => x !== id);
            }
            persistState();
            showToast('Category lock updated', 'info');
          };
        });

        const clearHistBtn = document.getElementById('btn-clear-history');
        if (clearHistBtn) {
          clearHistBtn.onclick = () => {
            state.history = [];
            state.watchedVod = {};
            persistState();
            showToast('Watch history cleared', 'info');
          };
        }

        const speedBtn = document.getElementById('btn-speed-test');
        if (speedBtn) {
          speedBtn.onclick = async () => {
            showToast('Testing stream server latency...', 'info');
            const t0 = performance.now();
            try {
              await fetch(PUBLIC_STREAMS.mux, { method: 'HEAD', mode: 'cors' });
              const ms = Math.round(performance.now() - t0);
              showToast(`Stream CDN latency: ${ms} ms (Healthy)`, 'success');
            } catch (e) {
              showToast('Speed check completed (check network/CORS)', 'warn');
            }
          };
        }
      }

      // Clock ticker
      if (clockTimer) clearInterval(clockTimer);
      clockTimer = setInterval(() => {
        const el = document.getElementById('live-clock');
        if (el) el.textContent = formatTime(Date.now());
      }, 15000);

      // Initial render
      render();
    })();
  </script>
</body>
</html>
